name: Task
description: A refactor, chore, test or docs change
title: "chore(<scope>): "
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part does this touch?
      multiple: true
      options:
        - ios
        - android
        - web
        - api
        - docs
        - ci
        - repo
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs doing?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What gets easier, safer or faster once this is done.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
