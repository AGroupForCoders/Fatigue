# Runs only the checks a pull request needs. See apps/docs/content/docs/ci-cd.mdx.
#
# `changes` works out which parts of the repository the pull request touches and
# every other job runs only when its part changed. `ci-ok` always runs and is the
# single check branch protection requires, so a skipped job never blocks a merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 22

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ios: ${{ steps.filter.outputs.ios }}
      tokens: ${{ steps.filter.outputs.tokens }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workspace: &workspace
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            api:
              - *workspace
              - 'apps/api/**'
              - 'packages/**'
            ios:
              - '.github/workflows/ci.yml'
              - 'apps/ios/**'
            tokens:
              - *workspace
              - 'packages/tokens/**'
            docs:
              - *workspace
              - 'apps/docs/**'

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:typecheck
      - run: pnpm api:test

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    env:
      DERIVED_DATA: ${{ github.workspace }}/apps/ios/DerivedData
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Pick a simulator
        id: simulator
        # The device names a runner ships with change with each Xcode release, so
        # pick the newest available iPhone instead of hard-coding one.
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          if [[ -z "$udid" || "$udid" == "null" ]]; then
            echo "No available iPhone simulator on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          # Boot it now so the Keychain is ready before the tests touch it.
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/Fatigue.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build and test
        working-directory: apps/ios
        # Parallel testing runs the tests on throwaway simulator clones, and the
        # Keychain is not reliable on those, so the tests run on the booted device.
        # The build stays signed (ad hoc, no team needed for a simulator) because an
        # unsigned app has no application identifier and the Keychain refuses it.
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Fatigue.xcodeproj \
            -scheme Fatigue \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/Fatigue.xcresult" \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation \
            | if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/Fatigue.xcresult
          if-no-files-found: ignore

  tokens:
    name: Tokens
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:types
      - run: pnpm docs:build

  ci-ok:
    name: CI OK
    needs: [changes, api, ios, tokens, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "A required job failed or was cancelled" >&2
            exit 1
          fi
          echo "All jobs passed or were skipped"
